services:
  bot:
    build: .
    image: aitue-whatsapp-bot:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      WP_PORT: "3001"
      SERVE_FRONTEND: "true"
      BOT_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - bot-data:/app/data
      - whatsapp-auth:/app/auth_info_baileys
    stop_grace_period: 30s

volumes:
  bot-data:
  whatsapp-auth:
